<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="幕伴 PiP：让网页视频在画中画窗口中播放，支持字幕、弹幕、截图和浮动评论区。"
    />
    <title>幕伴 PiP · 社交媒体预览图</title>
    <link rel="stylesheet" href="social-preview.zh-CN.css" />
  </head>
  <body>
    <main class="poster" aria-label="幕伴 PiP 社交媒体预览图">
      <section class="content">
        <div class="brand">
          <img src="../../assets/icon.png" alt="幕伴 PiP 图标" />
          <div>
            <div class="brand-name">幕伴 PiP</div>
            <div class="brand-note">PiP Companion · Browser Extension</div>
          </div>
        </div>
        <h1>追剧不霸屏，<br /><span>生活不暂停。</span></h1>
        <div class="features" aria-label="主要功能">
          <span class="feature"><i></i>画中画控制</span>
          <span class="feature"><i></i>双语字幕・弹幕</span>
          <span class="feature"><i></i>浮动评论区</span>
          <span class="feature"><i></i>视频截图</span>
        </div>
        <div class="footer">
          <span class="github-mark" aria-hidden="true">⌘</span>
          <span>免费开源 · 为观看体验多留一点空间</span>
        </div>
      </section>

      <div class="art" aria-hidden="true">
        <div class="orbit"><span class="orbit-dot"></span></div>
        <section class="video">
          <div class="video-top">
            <i class="window-dot"></i><i class="window-dot"></i
            ><i class="window-dot"></i>
            <span class="address"></span>
          </div>
          <div class="scene">
            <i class="scene-light"></i>
            <div class="danmaku">
              <span>23333333</span>
              <span>弹幕护体！</span>
              <span>笑不活了哈哈哈</span>
              <span>前方高能！</span>
              <span>这波操作绝了</span>
              <span>主角快回头啊！</span>
              <span>泪目了</span>
              <span>哈哈哈哈哈</span>
            </div>
            <div class="subtitle">
              每一幕都值得细细品味。<br />Every scene is worth savoring.
            </div>
            <div class="controls">
              <span class="play">▶</span><span>01:24</span>
              <div class="track"></div>
              <span>12:08</span><span>⚙</span>
            </div>
          </div>
        </section>
        <aside class="comment-card">
          <div class="comment-title">
            <span>大家的评论</span><span>•••</span>
          </div>
          <div class="comment">
            <i class="avatar"></i
            ><span class="comment-lines"><i></i><i></i></span>
          </div>
          <div class="comment">
            <i class="avatar"></i
            ><span class="comment-lines"><i></i><i></i></span>
          </div>
          <div class="comment">
            <i class="avatar"></i
            ><span class="comment-lines"><i></i><i></i></span>
          </div>
        </aside>
        <aside class="pip-window">
          <div class="pip-image">
            <span class="pip-subtitle">画面缩小，精彩不中断</span>
          </div>
          <div class="pip-meta">
            <span>画中画播放中</span><span class="pip-state">LIVE</span>
          </div>
        </aside>
        <div class="shortcut">
          <span>快速开启画中画</span><kbd>Shift + Alt/Opt + P</kbd>
        </div>
      </div>
    </main>
  </body>
</html>
