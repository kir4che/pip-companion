<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="幕伴 PiP：讓網頁影片在子母畫面中播放，支援字幕、彈幕、截圖與浮動留言區。"
    />
    <title>幕伴 PiP · 宣傳主圖</title>
    <link rel="stylesheet" href="social-preview.css" />
  </head>
  <body>
    <main class="poster" aria-label="幕伴 PiP 宣傳主圖">
      <section class="content">
        <div class="brand">
          <img src="../../assets/icon.png" alt="幕伴 PiP 圖示" />
          <div>
            <div class="brand-name">幕伴 PiP</div>
            <div class="brand-note">PiP Companion · Browser Extension</div>
          </div>
        </div>
        <h1>追劇不霸屏，<br /><span>生活不暫停。</span></h1>
        <div class="features" aria-label="主要功能">
          <span class="feature"><i></i>子母畫面控制</span>
          <span class="feature"><i></i>字幕・彈幕同步</span>
          <span class="feature"><i></i>浮動留言區</span>
          <span class="feature"><i></i>影片截圖</span>
        </div>
        <div class="footer">
          <span class="github-mark" aria-hidden="true">⌘</span>
          <span>開源免費 · 為觀看體驗多留一點空間</span>
        </div>
      </section>

      <div class="art" aria-hidden="true">
        <div class="orbit"><span class="orbit-dot"></span></div>
        <section class="video">
          <div class="video-top">
            <i class="window-dot"></i><i class="window-dot"></i
            ><i class="window-dot"></i>
            <span class="address"></span>
          </div>
          <div class="scene">
            <i class="scene-light"></i>
            <div class="danmaku">
              <span>這段好喜歡！</span>
              <span>終於等到更新了</span>
              <span>每次看都覺得好療癒</span>
              <span>這裡開始神展開！</span>
              <span>運鏡也太神了吧</span>
              <span>主角快回頭啊</span>
              <span>笑死我了哈哈哈</span>
              <span>聲音和畫面超搭</span>
            </div>
            <div class="subtitle">字幕與彈幕，同步陪你觀看</div>
            <div class="controls">
              <span class="play">▶</span><span>01:24</span>
              <div class="track"></div>
              <span>12:08</span><span>⚙</span>
            </div>
          </div>
        </section>
        <aside class="comment-card">
          <div class="comment-title">
            <span>大家的留言</span><span>•••</span>
          </div>
          <div class="comment">
            <i class="avatar"></i
            ><span class="comment-lines"><i></i><i></i></span>
          </div>
          <div class="comment">
            <i class="avatar"></i
            ><span class="comment-lines"><i></i><i></i></span>
          </div>
          <div class="comment">
            <i class="avatar"></i
            ><span class="comment-lines"><i></i><i></i></span>
          </div>
        </aside>
        <aside class="pip-window">
          <div class="pip-image">
            <span class="pip-caption">畫面縮小，精彩不中斷</span>
          </div>
          <div class="pip-meta">
            <span>子母畫面播放中</span><span class="pip-state">LIVE</span>
          </div>
        </aside>
        <div class="shortcut">
          <span>快速開啟子母畫面</span><kbd>Shift + Alt/Opt + P</kbd>
        </div>
      </div>
    </main>
  </body>
</html>
