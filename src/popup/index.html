<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__MSG_extName__</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <button class="primary" id="open-pip" type="button">
        <span id="open-pip-label">__MSG_popupOpenPip__</span>
        <kbd id="launch-shortcut"></kbd>
      </button>
      <section
        id="menu-view"
        class="popup-view"
        aria-label="__MSG_popupMainMenu__"
      >
        <div class="toggle-list">
          <div class="danmaku-toggle-row">
            <label class="danmaku-label" for="danmaku-toggle"
              >__MSG_popupDanmaku__</label
            >
            <div class="danmaku-toggle-controls">
              <div class="danmaku-action-buttons">
                <button
                  class="settings-open"
                  id="danmaku-settings-open"
                  type="button"
                  aria-label="__MSG_popupDanmakuDisplaySettings__"
                  title="__MSG_popupDanmakuDisplaySettings__"
                >
                  <svg
                    aria-hidden="true"
                    viewBox="0 0 24 24"
                    width="17"
                    height="17"
                  >
                    <use href="assets/settings-icon.svg#settings" />
                  </svg>
                </button>
                <button
                  class="settings-open"
                  id="extra-danmaku-open"
                  type="button"
                  aria-label="__MSG_popupExtraDanmakuSettings__"
                  title="__MSG_popupExtraDanmakuSettings__"
                >
                  <svg
                    aria-hidden="true"
                    viewBox="0 0 24 24"
                    width="17"
                    height="17"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                  >
                    <path d="M12 5v14M5 12h14" />
                  </svg>
                </button>
              </div>
              <input
                class="danmaku-switch"
                type="checkbox"
                id="danmaku-toggle"
                checked
              />
            </div>
          </div>
          <div class="toggle-row">
            <span>__MSG_popupSubtitleStyle__</span>
            <button
              class="settings-open"
              id="subtitle-settings-open"
              type="button"
              aria-label="__MSG_popupSubtitleStyleSettings__"
              title="__MSG_popupSubtitleStyleSettings__"
            >
              <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                width="17"
                height="17"
              >
                <use href="assets/settings-icon.svg#settings" />
              </svg>
            </button>
          </div>
          <label class="toggle-row">
            <span>__MSG_popupScreenshot__</span>
            <input type="checkbox" id="screenshot-toggle" checked />
          </label>
          <label class="toggle-row">
            <span>__MSG_popupFloatingComments__</span>
            <input type="checkbox" id="comments-toggle" checked />
          </label>
        </div>
        <p id="status" role="status"></p>
        <footer class="menu-footer">
          <span class="menu-version" id="ext-version"></span>
          <div class="footer-actions">
            <a
              class="settings-icon-btn"
              href="https://github.com/kir4che/pip-companion/issues/new?template=bug_report.yml"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="__MSG_popupReportIssue__"
              title="__MSG_popupReportIssue__"
            >
              <span class="feedback-icon" aria-hidden="true"></span>
            </a>
            <button
              class="settings-icon-btn"
              id="open-options-page"
              type="button"
              aria-label="__MSG_popupAllSettings__"
              title="__MSG_popupAllSettings__"
            >
              <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                width="14"
                height="14"
              >
                <use href="assets/settings-icon.svg#settings" />
              </svg>
            </button>
          </div>
        </footer>
      </section>
      <section
        id="danmaku-settings-view"
        class="popup-view settings-subview"
        aria-labelledby="danmaku-settings-title"
        hidden
      >
        <header class="settings-page-header">
          <button
            class="back-button"
            id="danmaku-settings-back"
            type="button"
            aria-label="__MSG_popupBackToMenu__"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <h1 id="danmaku-settings-title">__MSG_popupDanmakuStyle__</h1>
        </header>
        <div class="settings-content">
          <label class="range-row" for="danmaku-size">
            <span
              >__MSG_popupFontSize__
              <output id="danmaku-size-value">120%</output></span
            >
            <input id="danmaku-size" type="range" min="50" max="400" step="5" />
          </label>
          <label class="range-row" for="danmaku-speed">
            <span
              >__MSG_popupScrollSpeed__
              <output id="danmaku-speed-value"
                >__MSG_speedNormal__</output
              ></span
            >
            <input
              id="danmaku-speed"
              type="range"
              min="0"
              max="4"
              step="1"
              list="danmaku-speed-levels"
              aria-valuetext="__MSG_speedNormal__"
            />
            <datalist id="danmaku-speed-levels">
              <option value="0"></option>
              <option value="1"></option>
              <option value="2"></option>
              <option value="3"></option>
              <option value="4"></option>
            </datalist>
          </label>
          <label class="range-row" for="danmaku-opacity">
            <span
              >__MSG_popupOpacity__
              <output id="danmaku-opacity-value">85%</output></span
            >
            <input
              id="danmaku-opacity"
              type="range"
              min="10"
              max="100"
              step="5"
            />
          </label>
          <label class="range-row" for="danmaku-area">
            <span
              >__MSG_popupDisplayArea__
              <output id="danmaku-area-value">50%</output></span
            >
            <input id="danmaku-area" type="range" min="10" max="100" step="1" />
          </label>
          <label class="range-row" for="danmaku-font-family">
            <span>__MSG_popupFont__</span>
            <select id="danmaku-font-family">
              <optgroup label="__MSG_popupFontGeneral__">
                <option value="default">__MSG_popupSystemDefault__</option>
                <option value="sansSerif">__MSG_popupSansSerif__</option>
                <option value="serif">__MSG_popupSerif__</option>
                <option value="monospace">__MSG_popupMonospace__</option>
              </optgroup>
              <optgroup label="__MSG_popupFontAdvanced__">
                <option value="arial">__MSG_popupArialLatin__</option>
                <option value="notoSansTC">Noto Sans TC</option>
                <option value="microsoftJhengHei">
                  __MSG_popupBlackFont__
                </option>
                <option value="song">__MSG_popupSongFont__</option>
                <option value="fangSong">__MSG_popupFangSongFont__</option>
                <option value="kai">__MSG_popupKaiFont__</option>
              </optgroup>
            </select>
          </label>
          <label class="range-row" for="danmaku-weight">
            <span
              >__MSG_popupFontWeight__
              <output id="danmaku-weight-value">500</output></span
            >
            <input
              id="danmaku-weight"
              type="range"
              min="400"
              max="900"
              step="100"
            />
          </label>
          <label class="range-row" for="danmaku-max-size">
            <span
              >__MSG_popupMaxFontSize__
              <output id="danmaku-max-size-value">40px</output></span
            >
            <input
              id="danmaku-max-size"
              type="range"
              min="16"
              max="96"
              step="1"
            />
          </label>
          <button id="danmaku-style-reset" class="secondary" type="button">
            __MSG_popupResetDanmakuStyle__
          </button>
        </div>
      </section>
      <section
        id="extra-danmaku-settings-view"
        class="popup-view danmaku-settings-view"
        aria-labelledby="extra-danmaku-settings-title"
        hidden
      >
        <header class="settings-page-header">
          <button
            class="back-button"
            id="extra-danmaku-back"
            type="button"
            aria-label="__MSG_popupBackToMenu__"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <div class="settings-title-hint-group">
            <h1 id="extra-danmaku-settings-title">__MSG_popupExtraDanmaku__</h1>
            <button
              class="settings-hint-button"
              type="button"
              aria-label="__MSG_popupExtraDanmakuScope__"
              aria-describedby="extra-danmaku-scope-tooltip"
            >
              <svg
                aria-hidden="true"
                viewBox="0 0 20 20"
                width="16"
                height="16"
              >
                <use href="assets/help-icon.svg#help" />
              </svg>
              <span
                id="extra-danmaku-scope-tooltip"
                class="settings-hint-tooltip"
                role="tooltip"
                >__MSG_popupExtraDanmakuScopeTooltip__</span
              >
            </button>
          </div>
        </header>
        <div class="extra-danmaku-settings">
          <label class="source-toggle" for="extra-bilibili-enabled">
            <span>__MSG_popupExtraDanmakuEnabled__</span>
            <input id="extra-bilibili-enabled" type="checkbox" role="switch" />
          </label>
          <label class="range-row" for="extra-bilibili-url">
            <span class="source-url-label">
              <span class="source-url-label-text"
                >__MSG_popupExtraDanmakuUrl__</span
              >
              <button
                class="settings-hint-button"
                type="button"
                aria-label="__MSG_popupExtraDanmakuUrlSupportLabel__"
                aria-describedby="extra-danmaku-url-support-tooltip"
              >
                <svg
                  aria-hidden="true"
                  viewBox="0 0 20 20"
                  width="16"
                  height="16"
                >
                  <use href="assets/help-icon.svg#help" />
                </svg>
                <span
                  id="extra-danmaku-url-support-tooltip"
                  class="settings-hint-tooltip"
                  role="tooltip"
                  >__MSG_popupExtraDanmakuUrlSupport__</span
                >
              </button>
            </span>
            <span class="source-input-wrap">
              <input
                id="extra-bilibili-url"
                class="source-input"
                type="url"
                autocomplete="off"
                spellcheck="false"
              />
            </span>
          </label>
          <p id="extra-bilibili-url-hint" class="source-hint" hidden>
            __MSG_popupExtraDanmakuYouTubeHint__
          </p>
          <label class="range-row" for="extra-bilibili-offset">
            <span>__MSG_popupExtraDanmakuOffset__</span>
            <span class="source-input-wrap">
              <input
                id="extra-bilibili-offset"
                class="source-input"
                type="number"
                min="-3600"
                max="3600"
                step="0.1"
                value="0"
              />
              <span
                id="extra-bilibili-offset-error"
                class="source-input-error-tooltip"
                role="tooltip"
              ></span>
            </span>
          </label>
          <p
            id="extra-bilibili-status"
            class="source-status"
            role="status"
            aria-live="polite"
          ></p>
          <div
            id="extra-bilibili-switch-confirm"
            class="source-confirm"
            role="group"
            aria-labelledby="extra-bilibili-switch-confirm-message"
            hidden
          >
            <span id="extra-bilibili-switch-confirm-message">
              __MSG_popupExtraDanmakuSwitchConfirm__
            </span>
            <span class="source-confirm-actions">
              <button
                id="extra-bilibili-switch-confirm-yes"
                type="button"
                class="secondary"
              >
                __MSG_popupExtraDanmakuSwitchConfirmAction__
              </button>
              <button
                id="extra-bilibili-switch-confirm-no"
                type="button"
                class="secondary"
              >
                __MSG_popupExtraDanmakuSwitchCancelAction__
              </button>
            </span>
          </div>
        </div>
      </section>
      <section
        id="subtitle-settings-view"
        class="popup-view settings-subview"
        aria-labelledby="subtitle-settings-title"
        hidden
      >
        <header class="settings-page-header">
          <button
            class="back-button"
            id="subtitle-settings-back"
            type="button"
            aria-label="__MSG_popupBackToMenu__"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <h1 id="subtitle-settings-title">__MSG_popupSubtitleStyle__</h1>
        </header>
        <div class="settings-content">
          <div
            class="subtitle-preview"
            aria-label="__MSG_popupSubtitlePreview__"
          >
            <div class="subtitle-preview-subtitle" id="subtitle-preview">
              <span
                class="subtitle-preview-segment"
                id="subtitle-preview-primary"
                >__MSG_popupSubtitlePreviewText__</span
              >
              <span
                class="subtitle-preview-segment"
                id="subtitle-preview-secondary"
                >__MSG_popupSubtitlePreviewSecondLine__</span
              >
            </div>
          </div>
          <div class="subtitle-style-tabs" role="tablist">
            <button
              class="subtitle-style-tab is-active"
              id="subtitle-primary-tab"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="subtitle-primary-panel"
              data-subtitle-tab="primary"
            >
              __MSG_popupPrimarySubtitleStyle__
            </button>
            <button
              class="subtitle-style-tab"
              id="subtitle-secondary-tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="subtitle-secondary-panel"
              data-subtitle-tab="secondary"
            >
              __MSG_popupSecondarySubtitleStyle__
            </button>
          </div>
          <div
            class="subtitle-style-panel"
            id="subtitle-primary-panel"
            role="tabpanel"
            aria-labelledby="subtitle-primary-tab"
            data-subtitle-panel="primary"
          >
            <label class="range-row" for="primary-subtitle-size">
              <span
                >__MSG_popupFontSize__
                <output id="primary-subtitle-size-value">100%</output></span
              >
              <input
                id="primary-subtitle-size"
                type="range"
                min="50"
                max="200"
                step="5"
              />
            </label>
            <label class="color-row" for="primary-subtitle-text-color">
              <span>__MSG_popupTextColor__</span>
              <input
                id="primary-subtitle-text-color"
                type="color"
                aria-label="__MSG_popupTextColor__"
              />
            </label>
            <label class="range-row" for="primary-subtitle-font-family">
              <span>__MSG_popupFont__</span>
              <select id="primary-subtitle-font-family">
                <optgroup label="__MSG_popupFontGeneral__">
                  <option value="default">__MSG_popupSystemDefault__</option>
                  <option value="sansSerif">__MSG_popupSansSerif__</option>
                  <option value="serif">__MSG_popupSerif__</option>
                  <option value="monospace">__MSG_popupMonospace__</option>
                </optgroup>
                <optgroup label="__MSG_popupFontAdvanced__">
                  <option value="arial">__MSG_popupArialLatin__</option>
                  <option value="notoSansTC">Noto Sans TC</option>
                  <option value="microsoftJhengHei">
                    __MSG_popupBlackFont__
                  </option>
                  <option value="song">__MSG_popupSongFont__</option>
                  <option value="fangSong">__MSG_popupFangSongFont__</option>
                  <option value="kai">__MSG_popupKaiFont__</option>
                </optgroup>
              </select>
            </label>
            <label class="range-row" for="primary-subtitle-edge-style">
              <span>__MSG_popupTextEdge__</span>
              <select id="primary-subtitle-edge-style">
                <option value="none">__MSG_popupNone__</option>
                <option value="shadow">__MSG_popupShadow__</option>
                <option value="raised">__MSG_popupRaised__</option>
                <option value="depressed">__MSG_popupDepressed__</option>
                <option value="outline">__MSG_popupOutline__</option>
              </select>
            </label>
            <label class="color-row" for="primary-subtitle-edge-color">
              <span>__MSG_popupEdgeColor__</span>
              <input
                id="primary-subtitle-edge-color"
                type="color"
                aria-label="__MSG_popupEdgeColor__"
              />
            </label>
            <label
              class="range-row"
              for="primary-subtitle-edge-intensity"
              data-subtitle-edge-intensity-row="primary"
            >
              <span
                >__MSG_popupEdgeIntensity__
                <output id="primary-subtitle-edge-intensity-value"
                  >1</output
                ></span
              >
              <input
                id="primary-subtitle-edge-intensity"
                type="range"
                min="0.5"
                max="3"
                step="0.5"
              />
            </label>
            <label class="range-row" for="primary-subtitle-font-weight">
              <span
                >__MSG_popupFontWeight__
                <output id="primary-subtitle-font-weight-value"
                  >400</output
                ></span
              >
              <input
                id="primary-subtitle-font-weight"
                type="range"
                min="100"
                max="900"
                step="100"
              />
            </label>
            <label class="range-row" for="primary-subtitle-line-height">
              <span
                >__MSG_popupLineHeight__
                <output id="primary-subtitle-line-height-value"
                  >100%</output
                ></span
              >
              <input
                id="primary-subtitle-line-height"
                type="range"
                min="100"
                max="200"
                step="5"
              />
            </label>
          </div>
          <div
            class="subtitle-style-panel"
            id="subtitle-secondary-panel"
            role="tabpanel"
            aria-labelledby="subtitle-secondary-tab"
            data-subtitle-panel="secondary"
            hidden
          >
            <label class="range-row" for="secondary-subtitle-size">
              <span
                >__MSG_popupFontSize__
                <output id="secondary-subtitle-size-value">90%</output></span
              >
              <input
                id="secondary-subtitle-size"
                type="range"
                min="50"
                max="200"
                step="5"
              />
            </label>
            <label class="color-row" for="secondary-subtitle-text-color">
              <span>__MSG_popupTextColor__</span>
              <input
                id="secondary-subtitle-text-color"
                type="color"
                aria-label="__MSG_popupTextColor__"
              />
            </label>
            <label class="range-row" for="secondary-subtitle-font-family">
              <span>__MSG_popupFont__</span>
              <select id="secondary-subtitle-font-family">
                <optgroup label="__MSG_popupFontGeneral__">
                  <option value="default">__MSG_popupSystemDefault__</option>
                  <option value="sansSerif">__MSG_popupSansSerif__</option>
                  <option value="serif">__MSG_popupSerif__</option>
                  <option value="monospace">__MSG_popupMonospace__</option>
                </optgroup>
                <optgroup label="__MSG_popupFontAdvanced__">
                  <option value="arial">__MSG_popupArialLatin__</option>
                  <option value="notoSansTC">Noto Sans TC</option>
                  <option value="microsoftJhengHei">
                    __MSG_popupBlackFont__
                  </option>
                  <option value="song">__MSG_popupSongFont__</option>
                  <option value="fangSong">__MSG_popupFangSongFont__</option>
                  <option value="kai">__MSG_popupKaiFont__</option>
                </optgroup>
              </select>
            </label>
            <label class="range-row" for="secondary-subtitle-edge-style">
              <span>__MSG_popupTextEdge__</span>
              <select id="secondary-subtitle-edge-style">
                <option value="none">__MSG_popupNone__</option>
                <option value="shadow">__MSG_popupShadow__</option>
                <option value="raised">__MSG_popupRaised__</option>
                <option value="depressed">__MSG_popupDepressed__</option>
                <option value="outline">__MSG_popupOutline__</option>
              </select>
            </label>
            <label class="color-row" for="secondary-subtitle-edge-color">
              <span>__MSG_popupEdgeColor__</span>
              <input
                id="secondary-subtitle-edge-color"
                type="color"
                aria-label="__MSG_popupEdgeColor__"
              />
            </label>
            <label
              class="range-row"
              for="secondary-subtitle-edge-intensity"
              data-subtitle-edge-intensity-row="secondary"
            >
              <span
                >__MSG_popupEdgeIntensity__
                <output id="secondary-subtitle-edge-intensity-value"
                  >1</output
                ></span
              >
              <input
                id="secondary-subtitle-edge-intensity"
                type="range"
                min="0.5"
                max="3"
                step="0.5"
              />
            </label>
            <label class="range-row" for="secondary-subtitle-font-weight">
              <span
                >__MSG_popupFontWeight__
                <output id="secondary-subtitle-font-weight-value"
                  >500</output
                ></span
              >
              <input
                id="secondary-subtitle-font-weight"
                type="range"
                min="100"
                max="900"
                step="100"
              />
            </label>
            <label class="range-row" for="secondary-subtitle-line-height">
              <span
                >__MSG_popupLineHeight__
                <output id="secondary-subtitle-line-height-value"
                  >100%</output
                ></span
              >
              <input
                id="secondary-subtitle-line-height"
                type="range"
                min="100"
                max="200"
                step="5"
              />
            </label>
          </div>
          <div class="subtitle-style-actions">
            <button
              id="subtitle-style-reset-current"
              class="secondary"
              type="button"
            >
              __MSG_popupResetCurrentSubtitleStyle__
            </button>
          </div>
          <section class="subtitle-layout-section">
            <h2>__MSG_popupSharedSubtitleLayout__</h2>
            <label class="color-row" for="subtitle-layout-background-color">
              <span>__MSG_popupBackgroundColor__</span>
              <input
                id="subtitle-layout-background-color"
                type="color"
                aria-label="__MSG_popupBackgroundColor__"
              />
            </label>
            <label class="range-row" for="subtitle-layout-background-opacity">
              <span
                >__MSG_popupBackgroundOpacity__
                <output id="subtitle-layout-background-opacity-value"
                  >50%</output
                ></span
              >
              <input
                id="subtitle-layout-background-opacity"
                type="range"
                min="0"
                max="100"
                step="5"
              />
            </label>
            <label class="range-row" for="subtitle-layout-pair-gap">
              <span
                >__MSG_popupSubtitlePairGap__
                <output id="subtitle-layout-pair-gap-value"
                  >0.35em</output
                ></span
              >
              <input
                id="subtitle-layout-pair-gap"
                type="range"
                min="0"
                max="100"
                step="1"
              />
            </label>
            <label class="range-row" for="subtitle-layout-letter-spacing">
              <span
                >__MSG_popupLetterSpacing__
                <output id="subtitle-layout-letter-spacing-value"
                  >0.00em</output
                ></span
              >
              <input
                id="subtitle-layout-letter-spacing"
                type="range"
                min="0"
                max="30"
                step="1"
              />
            </label>
            <label class="range-row" for="subtitle-layout-position">
              <span
                >__MSG_popupVerticalPosition__
                <output id="subtitle-layout-position-value">10%</output></span
              >
              <input
                id="subtitle-layout-position"
                type="range"
                min="0"
                max="100"
                step="1"
              />
            </label>
