<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__MSG_extName__</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <button class="primary" id="open-pip" type="button">
        <span id="open-pip-label">__MSG_popupOpenPip__</span>
        <kbd id="launch-shortcut"></kbd>
      </button>
      <section
        id="menu-view"
        class="popup-view"
        aria-label="__MSG_popupMainMenu__"
      >
        <div class="toggle-list">
          <div class="danmaku-toggle-row">
            <label class="danmaku-label" for="danmaku-toggle"
              >__MSG_popupDanmaku__</label
            >
            <button
              class="settings-open"
              id="danmaku-settings-open"
              type="button"
              aria-label="__MSG_popupDanmakuDisplaySettings__"
              title="__MSG_popupDanmakuDisplaySettings__"
            >
              <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                width="17"
                height="17"
              >
                <use href="assets/settings-icon.svg#settings" />
              </svg>
            </button>
            <input
              class="danmaku-switch"
              type="checkbox"
              id="danmaku-toggle"
              checked
            />
          </div>
          <div class="toggle-row">
            <span>__MSG_popupCaptionStyle__</span>
            <button
              class="settings-open"
              id="caption-settings-open"
              type="button"
              aria-label="__MSG_popupCaptionStyleSettings__"
              title="__MSG_popupCaptionStyleSettings__"
            >
              <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                width="17"
                height="17"
              >
                <use href="assets/settings-icon.svg#settings" />
              </svg>
            </button>
          </div>
          <label class="toggle-row">
            <span>__MSG_popupScreenshot__</span>
            <input type="checkbox" id="screenshot-toggle" checked />
          </label>
          <label class="toggle-row">
            <span>__MSG_popupFloatingComments__</span>
            <input type="checkbox" id="comments-toggle" checked />
          </label>
          <label class="toggle-row">
            <span>__MSG_popupFollowPlayback__</span>
            <input type="checkbox" id="follow-playback-pip-toggle" />
          </label>
        </div>
        <footer class="menu-footer">
          <span class="menu-version" id="ext-version"></span>
          <div class="footer-actions">
            <a
              class="settings-icon-btn"
              href="https://github.com/kir4che/pip-companion/issues/new?template=bug_report.yml"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="__MSG_popupReportIssue__"
              title="__MSG_popupReportIssue__"
            >
              <span class="feedback-icon" aria-hidden="true"></span>
            </a>
            <button
              class="settings-icon-btn"
              id="open-options-page"
              type="button"
              aria-label="__MSG_popupAllSettings__"
              title="__MSG_popupAllSettings__"
            >
              <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                width="14"
                height="14"
              >
                <use href="assets/settings-icon.svg#settings" />
              </svg>
            </button>
          </div>
        </footer>
      </section>
      <section
        id="danmaku-settings-view"
        class="popup-view settings-subview"
        aria-labelledby="danmaku-settings-title"
        hidden
      >
        <header class="settings-page-header">
          <button
            class="back-button"
            id="danmaku-settings-back"
            type="button"
            aria-label="__MSG_popupBackToMenu__"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <h1 id="danmaku-settings-title">__MSG_popupDanmakuStyle__</h1>
        </header>
        <div class="settings-content">
          <label class="range-row" for="danmaku-size">
            <span
              >__MSG_popupFontSize__
              <output id="danmaku-size-value">120%</output></span
            >
            <input id="danmaku-size" type="range" min="50" max="400" step="5" />
          </label>
          <label class="range-row" for="danmaku-speed">
            <span
              >__MSG_popupScrollSpeed__
              <output id="danmaku-speed-value"
                >__MSG_speedNormal__</output
              ></span
            >
            <input
              id="danmaku-speed"
              type="range"
              min="0"
              max="4"
              step="1"
              list="danmaku-speed-levels"
              aria-valuetext="__MSG_speedNormal__"
            />
            <datalist id="danmaku-speed-levels">
              <option value="0"></option>
              <option value="1"></option>
              <option value="2"></option>
              <option value="3"></option>
              <option value="4"></option>
            </datalist>
          </label>
          <label class="range-row" for="danmaku-opacity">
            <span
              >__MSG_popupOpacity__
              <output id="danmaku-opacity-value">85%</output></span
            >
            <input
              id="danmaku-opacity"
              type="range"
              min="10"
              max="100"
              step="5"
            />
          </label>
          <label class="range-row" for="danmaku-area">
            <span
              >__MSG_popupDisplayArea__
              <output id="danmaku-area-value">50%</output></span
            >
            <input id="danmaku-area" type="range" min="10" max="100" step="1" />
          </label>
          <label class="range-row" for="danmaku-font-family">
            <span>__MSG_popupFont__</span>
            <select id="danmaku-font-family">
              <optgroup label="__MSG_popupFontGeneral__">
                <option value="default">__MSG_popupSystemDefault__</option>
                <option value="sansSerif">__MSG_popupSansSerif__</option>
                <option value="serif">__MSG_popupSerif__</option>
                <option value="monospace">__MSG_popupMonospace__</option>
              </optgroup>
              <optgroup label="__MSG_popupFontAdvanced__">
                <option value="arial">__MSG_popupArialLatin__</option>
                <option value="notoSansTC">Noto Sans TC</option>
                <option value="microsoftJhengHei">
                  __MSG_popupBlackFont__
                </option>
                <option value="song">__MSG_popupSongFont__</option>
                <option value="fangSong">__MSG_popupFangSongFont__</option>
                <option value="kai">__MSG_popupKaiFont__</option>
              </optgroup>
            </select>
          </label>
          <label class="range-row" for="danmaku-weight">
            <span
              >__MSG_popupFontWeight__
              <output id="danmaku-weight-value">500</output></span
            >
            <input
              id="danmaku-weight"
              type="range"
              min="400"
              max="900"
              step="100"
            />
          </label>
          <label class="range-row" for="danmaku-max-size">
            <span
              >__MSG_popupMaxFontSize__
              <output id="danmaku-max-size-value">40px</output></span
            >
            <input
              id="danmaku-max-size"
              type="range"
              min="16"
              max="96"
              step="1"
            />
          </label>
          <button id="danmaku-style-reset" class="secondary" type="button">
            __MSG_popupResetDanmakuStyle__
          </button>
        </div>
      </section>
      <section
        id="caption-settings-view"
        class="popup-view settings-subview"
        aria-labelledby="caption-settings-title"
        hidden
      >
        <header class="settings-page-header">
          <button
            class="back-button"
            id="caption-settings-back"
            type="button"
            aria-label="__MSG_popupBackToMenu__"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <h1 id="caption-settings-title">__MSG_popupCaptionStyle__</h1>
        </header>
        <div class="settings-content">
          <div
            class="subtitle-preview"
            aria-label="__MSG_popupCaptionPreview__"
          >
            <div class="subtitle-preview-caption" id="caption-preview">
              <span class="subtitle-preview-segment"
                >__MSG_popupCaptionPreviewText__</span
              >
              <span class="subtitle-preview-segment"
                >__MSG_popupCaptionPreviewSecondLine__</span
              >
            </div>
          </div>
          <label class="range-row" for="caption-size">
            <span
              >__MSG_popupFontSize__
              <output id="caption-size-value">100%</output></span
            >
            <input id="caption-size" type="range" min="50" max="200" step="5" />
          </label>
          <label class="color-row" for="caption-text-color">
            <span>__MSG_popupTextColor__</span>
            <input
              id="caption-text-color"
              type="color"
              aria-label="__MSG_popupTextColor__"
            />
          </label>
          <label class="color-row" for="caption-background-color">
            <span>__MSG_popupBackgroundColor__</span>
            <input
              id="caption-background-color"
              type="color"
              aria-label="__MSG_popupBackgroundColor__"
            />
          </label>
          <label class="range-row" for="caption-background-opacity">
            <span
              >__MSG_popupBackgroundOpacity__
              <output id="caption-background-opacity-value">75%</output></span
            >
            <input
              id="caption-background-opacity"
              type="range"
              min="0"
              max="100"
              step="5"
            />
          </label>
          <label class="range-row" for="caption-position">
            <span
              >__MSG_popupVerticalPosition__
              <output id="caption-position-value">10%</output></span
            >
            <input
              id="caption-position"
              type="range"
              min="0"
              max="100"
              step="1"
            />
          </label>
          <label class="range-row" for="caption-font-family">
            <span>__MSG_popupFont__</span>
            <select id="caption-font-family">
              <optgroup label="__MSG_popupFontGeneral__">
                <option value="default">__MSG_popupSystemDefault__</option>
                <option value="sansSerif">__MSG_popupSansSerif__</option>
                <option value="serif">__MSG_popupSerif__</option>
                <option value="monospace">__MSG_popupMonospace__</option>
              </optgroup>
              <optgroup label="__MSG_popupFontAdvanced__">
                <option value="arial">__MSG_popupArialLatin__</option>
                <option value="notoSansTC">Noto Sans TC</option>
                <option value="microsoftJhengHei">
                  __MSG_popupBlackFont__
                </option>
                <option value="song">__MSG_popupSongFont__</option>
                <option value="fangSong">__MSG_popupFangSongFont__</option>
                <option value="kai">__MSG_popupKaiFont__</option>
              </optgroup>
            </select>
          </label>
          <label class="range-row" for="caption-edge-style">
            <span>__MSG_popupTextEdge__</span>
            <select id="caption-edge-style">
              <option value="none">__MSG_popupNone__</option>
              <option value="shadow">__MSG_popupShadow__</option>
              <option value="raised">__MSG_popupRaised__</option>
              <option value="depressed">__MSG_popupDepressed__</option>
              <option value="outline">__MSG_popupOutline__</option>
            </select>
          </label>
          <label class="color-row" for="caption-edge-color">
            <span>__MSG_popupEdgeColor__</span>
            <input
              id="caption-edge-color"
              type="color"
              aria-label="__MSG_popupEdgeColor__"
            />
          </label>
          <label
            id="caption-outline-width-row"
            class="range-row"
            for="caption-outline-width"
          >
            <span
              >__MSG_popupOutlineWidth__
              <output id="caption-outline-width-value">1px</output></span
            >
            <input
              id="caption-outline-width"
              type="range"
              min="0.5"
              max="3"
              step="0.5"
            />
          </label>
          <label class="range-row" for="caption-font-weight">
            <span
              >__MSG_popupFontWeight__
              <output id="caption-font-weight-value">400</output></span
            >
            <input
              id="caption-font-weight"
              type="range"
              min="100"
              max="900"
              step="100"
            />
          </label>
          <label class="range-row" for="caption-line-height">
            <span
              >__MSG_popupLineHeight__
              <output id="caption-line-height-value">100%</output></span
            >
            <input
              id="caption-line-height"
              type="range"
              min="100"
              max="200"
              step="5"
            />
          </label>
          <button id="caption-style-reset" class="secondary" type="button">
            __MSG_popupResetCaptionStyle__
          </button>
        </div>
      </section>
      <p id="status" role="status"></p>
    </main>
    <script src="shared/locales.js"></script>
    <script src="shared/utils.js"></script>
    <script src="shared/danmaku-settings.js"></script>
    <script src="shared/caption-settings.js"></script>
    <script type="module" src="popup/index.js"></script>
  </body>
</html>
